name: Debian VM integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-and-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: mvn -B -ntp verify
      - name: Generate ephemeral SSH key and configure VM
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C ci@mcvm -f "$RUNNER_TEMP/mcvm_ci_key"
          mkdir -p data/plugins/McVm
          printf 'ssh-public-key: %s\nmemory-mb: 1024\ncpus: 1\nssh-port: 2222\n' \
            "$(cat "$RUNNER_TEMP/mcvm_ci_key.pub")" > data/plugins/McVm/config.yml
          sudo chown -R 1000:1000 data
      - name: Boot Paper and Debian VM
        run: docker compose up --build -d
      - name: Wait for Debian SSH and verify OS
        shell: bash
        run: |
          set -euo pipefail
          until ssh -p 2222 -i "$RUNNER_TEMP/mcvm_ci_key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 debian@127.0.0.1 \
              'grep -q "^ID=debian$" /etc/os-release && test -d /home/debian' \
              >/dev/null 2>&1; do
            if (( SECONDS >= 1800 )); then echo 'Debian SSH boot timed out' >&2; exit 1; fi
            sleep 10
          done
          ssh -p 2222 -i "$RUNNER_TEMP/mcvm_ci_key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            debian@127.0.0.1 'printf "%s\n" mcvm-ci-persist > /home/debian/mcvm-ci-marker && sync'
      - name: Restart container and verify disk persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose restart minecraft
          until ssh -p 2222 -i "$RUNNER_TEMP/mcvm_ci_key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 debian@127.0.0.1 \
              'grep -qx mcvm-ci-persist /home/debian/mcvm-ci-marker' \
              >/dev/null 2>&1; do
            if (( SECONDS >= 900 )); then echo 'Debian disk persistence timed out' >&2; exit 1; fi
            sleep 10
          done
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 || true
          if test -f data/plugins/McVm/vm/commands.log; then tail -100 data/plugins/McVm/vm/commands.log; fi
          if test -f data/plugins/McVm/vm/serial.log; then tail -100 data/plugins/McVm/vm/serial.log; fi
      - name: Stop containers
        if: always()
        run: docker compose down --timeout 30
