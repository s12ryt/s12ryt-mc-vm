name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package
        run: mvn -B -ntp verify
      - name: Check distributable JAR
        shell: bash
        run: |
          jar tf target/mc-vm-1.0.0.jar | grep -qx 'tw/cute/mcvm/McVmPlugin.class'
          jar tf target/mc-vm-1.0.0.jar | grep -qx 'plugin.yml'
          if jar tf target/mc-vm-1.0.0.jar | grep -qE '^(org/bukkit/|tw/cute/mcvm/CoreTests.class)'; then
            echo 'Test classes or Bukkit stubs leaked into the plugin JAR' >&2
            exit 1
          fi
          javap -verbose -classpath target/mc-vm-1.0.0.jar tw.cute.mcvm.McVmPlugin | grep -q 'major version: 52'
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: mc-vm-plugin
          path: target/mc-vm-1.0.0.jar
          if-no-files-found: error

  docker:
    name: Docker image and tools
    needs: java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mc-vm-plugin
          path: target
      - name: Build deployment image
        run: docker build -t mc-vm:ci .
      - name: Check QEMU, ISO tools and packaged plugin
        run: |
          docker run --rm --entrypoint sh mc-vm:ci -ec '
            qemu-system-x86_64 --version
            qemu-img --version
            genisoimage --version
            test -s /plugins/mc-vm.jar
          '

  paper-compatibility:
    name: Paper ${{ matrix.minecraft }} / Java ${{ matrix.java }}
    needs: java
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '1.8.8', java: '8', build: '445' }
          - { minecraft: '1.12.2', java: '11', build: '1620' }
          - { minecraft: '1.16.5', java: '16', build: '794' }
          - { minecraft: '1.18.2', java: '17', build: '388' }
          - { minecraft: '1.21.4', java: '21', build: '232' }
          - { minecraft: '1.21.8', java: '21', build: '60' }
          - { minecraft: '1.21.11', java: '21', build: '132' }
          - { minecraft: '26.1.2', java: '25', build: '74' }
          - { minecraft: '26.2', java: '25', build: '129' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: mc-vm-plugin
          path: target
      - name: Test startup verifier
        run: |
          bash src/test/sh/paper-matrix-test.sh
          bash src/test/sh/verify-paper-startup-test.sh
      - name: Start Paper
        run: |
          test -s target/mc-vm-1.0.0.jar
          docker run -d --name mcvm-paper \
            -e EULA=TRUE -e TYPE=PAPER \
            -e VERSION='${{ matrix.minecraft }}' -e PAPER_BUILD='${{ matrix.build }}' \
            -e MEMORY=2G -e ONLINE_MODE=FALSE \
            -v "$PWD/target/mc-vm-1.0.0.jar:/plugins/mc-vm.jar:ro" \
            'itzg/minecraft-server:java${{ matrix.java }}'
      - name: Verify Minecraft version and plugin startup
        run: bash scripts/verify-paper-startup.sh mcvm-paper '${{ matrix.minecraft }}'
      - name: Startup diagnostics
        if: failure()
        run: docker logs --tail=200 mcvm-paper || true
      - name: Stop Paper
        if: always()
        run: docker rm -f mcvm-paper || true
